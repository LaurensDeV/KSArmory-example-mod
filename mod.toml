# A KSA content mod, and nothing else. No [StarMap] section, no assembly, no code.
#
# KSArmory finds the weapons in KSArmory/Weapons.xml by looking in the same place inside every
# installed mod. It is not listed here on purpose: KSA hands every entry in `assets` to its own
# asset-bundle loader, which would parse a weapon file with the wrong reader.

name = "KSArmory Example Mod"

assets = [
    "ExampleModAssets.xml",
    "ExampleModGameData.xml",
]
