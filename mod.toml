# A KSA content mod, and nothing else. No [StarMap] section, no assembly, no code.
#
# KSArmory finds the weapons by reading every .xml in the KSArmory/ folder inside every installed
# mod; Weapons.xml is only this mod's choice of name. It is not listed here on purpose: KSA hands every entry in `assets` to its own
# asset-bundle loader, which would parse a weapon file with the wrong reader.

name = "KSArmory Example Pack"

assets = [
    "ExampleModAssets.xml",
    "ExampleModGameData.xml",
    "ExampleModEffects.xml",
    "ExampleCopyAssets.xml",
    "ExampleCopyGameData.xml",
    "ExampleCopySounds.xml",
]
